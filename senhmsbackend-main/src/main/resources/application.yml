
spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/hms_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:Root@123}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HmsHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.hms: DEBUG
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

# JWT configuration
app:
  jwt:
    # Override with JWT_SECRET in production
    secret: "${JWT_SECRET:local-dev-only-secret-change-me-min-256-bits-long-placeholder-value}"
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  upload:
    # Override with APP_UPLOAD_DIR when deploying
    dir: "${APP_UPLOAD_DIR:D:/GitHubAjay/}"

  # OpenAI (voice + handwritten prescription). Key comes ONLY from the OPENAI_API_KEY env var.
  openai:
    api-key: "${OPENAI_API_KEY:}"
    transcribe-model: "${OPENAI_TRANSCRIBE_MODEL:gpt-4o-transcribe}"
    draft-model: "${OPENAI_DRAFT_MODEL:gpt-4.1}"
    vision-model: "${OPENAI_VISION_MODEL:gpt-4.1}"
    case-sheet-model: "${OPENAI_CASE_SHEET_MODEL:gpt-4.1}"

# CORS configuration
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}"
